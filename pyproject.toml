[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "frontdoor-conditionals"
version = "0.1.0"
description = "Synthetic conditional-request experiments for Azure Front Door"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "quintindk"}]
dependencies = []

[project.urls]
Repository = "https://github.com/quintindk/frontdoor-conditionals"

[project.scripts]
frontdoor-origin = "frontdoor_lab.origin:main"
frontdoor-probe = "frontdoor_lab.probe:main"
frontdoor-experiments = "frontdoor_lab.experiments:main"
frontdoor-analyse = "frontdoor_lab.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]
